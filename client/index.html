<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Cygnus AI Labs — AI Automation &amp; Intelligence</title>
    <meta name="description" content="Cygnus AI Labs helps businesses bring structure to complex, unorganized processes through applied AI research, development, and intelligent automation." />
    <meta name="theme-color" content="#030305" />

    <!-- Open Graph / Social Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cygnus AI Labs — AI Automation &amp; Intelligence" />
    <meta property="og:description" content="AI research and development that helps businesses bring structure to complex, unorganised processes." />
    <meta property="og:image" content="/cygnus-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cygnus AI Labs — AI Automation &amp; Intelligence" />
    <meta name="twitter:description" content="AI research and development that helps businesses bring structure to complex, unorganised processes." />
    <meta name="twitter:image" content="/cygnus-logo.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/cygnus-logo.png" />
    <link rel="apple-touch-icon" href="/cygnus-logo.png" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts: Outfit (display) + DM Sans (body) + Fira Code (mono) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Fira+Code:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Prevent flash of unstyled content -->
    <style>
      html { background-color: #030305; }
      body { opacity: 0; transition: opacity 0.15s ease; }
      body.loaded { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        document.body.classList.add('loaded');
      });
    </script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%">
    </script>
  </body>
</html>
